name: Release dry run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-candidate:
    name: Release candidate / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out the selected commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies from the frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Run formatting
        run: pnpm format

      - name: Confirm formatting made no changes
        run: git diff --exit-code

      - name: Check lint
        run: pnpm lint

      - name: Check types
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build workspace
        run: pnpm build

      - name: Validate packed Codex installation
        run: pnpm verify:codex-package -- --require-secure-dependencies

      - name: Certify isolated clean source installation
        run: pnpm verify:clean-source

      - name: Build release-candidate tarballs and checksums
        run: pnpm release:artifacts -- --output release-artifacts

      - name: Generate SPDX release-candidate SBOM
        run: pnpm release:sbom -- --output release-artifacts/temporalthread-v0.1.0.spdx.json

      - name: Verify release-candidate artifacts
        run: >-
          pnpm verify:release-artifacts -- --artifacts release-artifacts --require-clean --require-sbom
          --expected-commit ${{ github.sha }}

      - name: Audit production dependencies
        run: pnpm audit

      - name: Upload release-candidate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: temporalthread-v0.1.0-rc-${{ matrix.os }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
