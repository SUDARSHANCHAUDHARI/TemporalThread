name: Bug report
description: Report a reproducible TemporalThread defect without private conversation data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach real prompts, databases, exports, credentials, or local agent configuration.
  - type: input
    id: version
    attributes:
      label: TemporalThread version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain the observed and expected behavior using synthetic data.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence of commands or MCP calls.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include only relevant, reviewed output. Remove paths, identifiers, and private content.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, personal data, real conversations, databases, and local agent configuration.
          required: true
